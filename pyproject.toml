[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diverag"
version = "0.1.0"
description = "Retrieval-augmented QA over approved, public diving manuals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
parse = ["pymupdf", "pdfplumber", "ebooklib", "beautifulsoup4"]
embed = ["sentence-transformers"]
llm = ["anthropic"]
dev = ["pytest"]

[project.scripts]
diverag = "diverag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
